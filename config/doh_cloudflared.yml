# Cloudflared DNS-over-HTTPS (DoH) Local Forwarder Configuration
# Listens locally on 127.0.0.1:53 or 127.0.0.1:5053 and forwards queries via DoH to Cloudflare Privacy Resolver.
# Zero ISP logging, zero plain-text DNS traffic.

proxy-dns: true
proxy-dns-port: 5053
proxy-dns-address: 127.0.0.1

upstream:
  - https://1.1.1.1/dns-query
  - https://1.0.0.1/dns-query
  - https://[2606:4700:4700::1111]/dns-query
  - https://[2606:4700:4700::1001]/dns-query

fallback:
  - https://9.9.9.9/dns-query

# Disable telemetry and local request logging to enforce strict zero-log policy
no-autoupdate: true
metrics: 127.0.0.1:0
loglevel: fatal
logfile: /dev/null
